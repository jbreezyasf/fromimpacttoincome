name: Backfill Source Links

# Adds "Read the thread" backlinks to an issue published before source
# attribution existed, without rewriting its content. Claude is asked only
# "which messages is this passage describing?" — the published prose is an
# input, never an output, and the script aborts if the merge would change
# so much as one character of it.
#
# Manual only. This edits a published issue, so it should never fire on a timer.
#
# Always run once with dry_run checked first: that prints the chosen links and a
# diff of the rendered HTML without writing anything.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "issue_number — one issue (16), a range (1-15), or all. Ignored when survey is checked."
        required: false
      survey:
        description: "survey — just report which issues are linkable. No model calls, no writes."
        type: boolean
        default: false
      dry_run:
        description: "dry_run — PREVIEW ONLY, writes nothing. UNCHECK THIS to actually apply the links."
        type: boolean
        default: true
      no_commit:
        description: "no_commit — update Supabase but skip the HTML commit and deploy"
        type: boolean
        default: false

concurrency:
  group: newsletter-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: client/newsletter-cron
        run: pip install -r requirements.txt

      - name: Backfill
        working-directory: client/newsletter-cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://owtljqjastcewgqqntdu.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_GROUP: ${{ secrets.TELEGRAM_GROUP }}
          TELEGRAM_LINK_BASE: ${{ secrets.TELEGRAM_LINK_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          NEWSLETTER_OUTPUT_DIR: client/public/newsletter
          NEWSLETTER_TEMPLATE_FILE: junk-mail-TEMPLATE.html
        run: |
          set -euo pipefail

          missing=""
          [ -z "${SUPABASE_SERVICE_KEY:-}" ] && missing="$missing SUPABASE_SERVICE_KEY"
          [ -z "${ANTHROPIC_API_KEY:-}" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${TELEGRAM_GROUP:-}" ] && [ -z "${TELEGRAM_LINK_BASE:-}" ]; then
            echo "::error::Set TELEGRAM_GROUP (e.g. -1001234567890) or TELEGRAM_LINK_BASE."
            echo "::error::Without one there is no way to build a message URL."
            exit 1
          fi

          if [ "${{ inputs.survey }}" = "true" ]; then
            ARGS="--survey"
          else
            if [ -z "${{ inputs.issue_number }}" ]; then
              echo "::error::issue_number is required unless survey is checked."
              exit 1
            fi
            ARGS="--issue ${{ inputs.issue_number }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
            if [ "${{ inputs.no_commit }}" = "true" ]; then ARGS="$ARGS --no-commit"; fi
          fi

          echo "python backfill_sources.py $ARGS"
          python backfill_sources.py $ARGS 2>&1 | tee /tmp/backfill.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backfill — Issue #${{ inputs.issue_number }}"
            echo ""
            # A dry run and a real run both finish green, so the outcome has to
            # be stated outright — a quiet "dry run: true" line is too easy to
            # miss when the run reports success either way.
            if [ "${{ inputs.survey }}" = "true" ]; then
              echo "> ## 🔎 SURVEY — NOTHING WAS WRITTEN"
              echo "> Coverage report only. No model calls were made."
            elif [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "> ## ⚠️ PREVIEW ONLY — NOTHING WAS WRITTEN"
              echo "> The links below were **not** applied. To apply them, run again"
              echo "> with the \`dry_run\` checkbox **unchecked**."
            elif [ "${{ inputs.no_commit }}" = "true" ]; then
              echo "> ## ✅ Supabase updated — HTML not committed"
              echo "> \`no_commit\` was checked, so the rendered issue was not published."
            else
              echo "> ## ✅ Applied — Supabase updated and HTML committed"
            fi
            echo ""
            if [ -f /tmp/backfill.log ]; then
              echo '```'
              tail -n 60 /tmp/backfill.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
