name: Weekly Newsletter

# Manual-only. Railway (client/newsletter-cron/railway.toml) is the primary
# weekly runner and Newsletter Weekly Ensure is the automated safety net, so
# this workflow no longer runs on a schedule — two schedulers generating the
# same issue produced duplicate/conflicting output.
#
# Kept for targeted backfills: this is the only path that can regenerate the
# newsletter_issues row for an arbitrary week without touching Telegram or
# committing HTML.
on:
  workflow_dispatch:
    inputs:
      week_start:
        description: "Monday of the target week (YYYY-MM-DD). Leave blank for current ISO week."
        required: false
      issue:
        description: "Override issue number (optional)"
        required: false
      publish:
        description: "Publish immediately"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (print JSON, write nothing)"
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose. package.json already pins pnpm via
      # "packageManager", and specifying it in both places makes the action
      # fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate newsletter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.week_start }}" ]; then ARGS="$ARGS --week-start ${{ inputs.week_start }}"; fi
          if [ -n "${{ inputs.issue }}" ]; then ARGS="$ARGS --issue ${{ inputs.issue }}"; fi
          if [ "${{ inputs.publish }}" = "true" ]; then ARGS="$ARGS --publish"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          pnpm generate:newsletter $ARGS
