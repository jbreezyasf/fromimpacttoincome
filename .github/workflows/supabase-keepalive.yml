name: Supabase Keepalive

# Free-tier Supabase projects auto-pause after ~7 days without activity, which
# is what silently breaks the weekly newsletter. The Telegram scraper only
# touches the database once a week, so a single missed Railway run puts the
# project within range of pausing.
#
# This is the cheap preventative half of the fix: a tiny daily read against
# newsletter_config. Newsletter Weekly Ensure is the recovery half, for when
# the project has already gone to sleep.

on:
  schedule:
    # 13:17 UTC daily. Off-the-hour to avoid GitHub's peak-of-hour queueing.
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_KEY secrets are required."
            exit 1
          fi

          code=$(curl -s -o /tmp/ping.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/newsletter_config?select=id&limit=1")

          echo "HTTP $code"
          cat /tmp/ping.json

          if [ "$code" != "200" ]; then
            echo "::error::Keepalive ping failed with HTTP $code — the project may already be paused."
            exit 1
          fi
          echo "Supabase is awake."
