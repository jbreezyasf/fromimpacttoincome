name: Newsletter Weekly Ensure

# Safety net for the weekly Junk Mail issue.
#
# Railway (client/newsletter-cron/railway.toml) is the primary runner and fires
# at 14:00 UTC / 9:00 AM CT every Sunday. This workflow runs twice daily and
# does three things:
#
#   1. Wakes the Supabase project if it has auto-paused (free-tier projects
#      pause after ~7 days idle), waiting until it reports ACTIVE_HEALTHY.
#   2. Checks whether Railway actually produced this week's issue — both the
#      newsletter_issues row AND the committed static HTML. If either is
#      missing, it reruns the same Python pipeline Railway uses.
#   3. Pings the Vercel deploy hook so the site rebuilds regardless.
#
# It is deliberately idempotent: when the week's issue already exists, the run
# wakes the DB, confirms the issue, redeploys, and exits without generating.
# That is what makes a daily schedule cheap and a missed Sunday recoverable.

on:
  schedule:
    # DAILY, not Sunday-only. Two earlier designs failed here.
    #
    # First a guard exited unless the local Chicago hour was 09; GitHub ran the
    # crons 68 and 58 minutes late and both firings were skipped. That guard was
    # removed in favour of three attempts across Sunday.
    #
    # Then on 2026-08-30 none of those three fired at all. GitHub's scheduler was
    # running hours behind for this account — the daily keepalive drifted +9h39m
    # on Aug 27 and +9h43m on Aug 28 — and delayed schedules get dropped. Three
    # attempts were no help because all three rode the same scheduler on the same
    # day, so one bad Sunday still lost the week.
    #
    # Running daily removes that coupling: a dropped Sunday is picked up on
    # Monday. The target week is the last full Sun-Sat and does not change until
    # the next Sunday, so every run from Sunday to Saturday aims at the same
    # issue. The job is idempotent, so once it exists the remaining runs cost a
    # lookup and exit.
    - cron: "30 14 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      force_generate:
        description: "force_generate — generate even if this week's issue already exists"
        type: boolean
        default: false
      skip_generate:
        description: "skip_generate — only wake Supabase and redeploy; never generate"
        type: boolean
        default: false

concurrency:
  group: newsletter-weekly
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Computes the target week using the same Sun→Sat convention as
  # generate_newsletter.py. It no longer decides whether to proceed: that check
  # skipped the only two firings on 2026-08-02 and reported success anyway.
  # ───────────────────────────────────────────────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    outputs:
      week_start: ${{ steps.check.outputs.week_start }}
      week_end: ${{ steps.check.outputs.week_end }}
    steps:
      - id: check
        env:
          TZ: America/Chicago
        run: |
          set -euo pipefail

          # Mirrors get_week_range() in client/newsletter-cron/generate_newsletter.py:
          # the last full Sunday → Saturday week. `date +%w` (0=Sunday) is the
          # same value as Python's (weekday() + 1) % 7.
          dow=$(date +%w)
          week_start=$(date -d "-$((dow + 7)) days" +%F)
          week_end=$(date -d "$week_start +6 days" +%F)
          echo "Target week: $week_start → $week_end"

          echo "week_start=$week_start" >> "$GITHUB_OUTPUT"
          echo "week_end=$week_end" >> "$GITHUB_OUTPUT"

  ensure:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # generate_newsletter.py commits the rendered issue HTML via the GitHub
      # contents API using GITHUB_TOKEN.
      contents: write
    env:
      WEEK_START: ${{ needs.guard.outputs.week_start }}
      WEEK_END: ${{ needs.guard.outputs.week_end }}
      # The project URL is public — it ships in the client bundle as
      # VITE_SUPABASE_URL — so it defaults rather than being a required secret.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://owtljqjastcewgqqntdu.supabase.co' }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5

      # ─── 0. Which credentials can this job actually see? ────────────────────
      # Reports presence only, never values. Added because a run failed with
      # every Supabase env var blank, and there was no way to tell a missing
      # secret from one stored under a different name.
      - name: Preflight — secret visibility
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          IMPACT_NEWSLETTER: ${{ secrets.IMPACT_NEWSLETTER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          NEWSLETTER_BASE_URL: ${{ secrets.NEWSLETTER_BASE_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_GROUP: ${{ secrets.TELEGRAM_GROUP }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          set -euo pipefail
          report() {
            if [ -n "${2:-}" ]; then echo "| \`$1\` | present |"; else echo "| \`$1\` | — |"; fi
          }
          {
            echo "### Secret visibility"
            echo ""
            echo "| Secret | Status |"
            echo "| --- | --- |"
            report SUPABASE_SERVICE_KEY   "${SUPABASE_SERVICE_KEY:-}"
            report SUPABASE_ACCESS_TOKEN  "${SUPABASE_ACCESS_TOKEN:-}"
            report IMPACT_NEWSLETTER      "${IMPACT_NEWSLETTER:-}"
            report ANTHROPIC_API_KEY      "${ANTHROPIC_API_KEY:-}"
            report VERCEL_DEPLOY_HOOK_URL "${VERCEL_DEPLOY_HOOK_URL:-}"
            report NEWSLETTER_BASE_URL    "${NEWSLETTER_BASE_URL:-}"
            report TELEGRAM_API_ID        "${TELEGRAM_API_ID:-}"
            report TELEGRAM_API_HASH      "${TELEGRAM_API_HASH:-}"
            report TELEGRAM_GROUP         "${TELEGRAM_GROUP:-}"
            report TELEGRAM_SESSION_STRING "${TELEGRAM_SESSION_STRING:-}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ─── 1. Wake Supabase ───────────────────────────────────────────────────
      - name: Wake Supabase if paused
        env:
          # This repo stores the Management API token as IMPACT_NEWSLETTER.
          # SUPABASE_ACCESS_TOKEN is accepted first so a future rename to the
          # conventional name just works without editing this file.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.IMPACT_NEWSLETTER }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          # Not a secret — this ref already ships publicly in the client bundle
          # via VITE_SUPABASE_URL. Used only if the two above yield nothing.
          DEFAULT_PROJECT_REF: owtljqjastcewgqqntdu
        run: |
          set -euo pipefail

          # Ask the project itself whether it is awake, using the service key we
          # already need for everything downstream. A paused project's REST
          # endpoint refuses connections, so a 200 here settles it without ever
          # touching the account-level Management API. That keeps the privileged
          # token on the rare path — restoring — rather than the every-week one.
          ping=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/newsletter_config?select=id&limit=1") || ping="000"

          if [ "$ping" = "200" ]; then
            echo "REST ping returned 200 — project is awake, no unpause needed."
            exit 0
          fi
          echo "REST ping returned $ping — project may be paused. Falling back to the Management API."

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::The project looks unreachable and no Management API token is available to restore it."
            echo "::error::Checked secrets SUPABASE_ACCESS_TOKEN and IMPACT_NEWSLETTER; both were empty."
            exit 1
          fi

          # Management API tokens are personal access tokens and always start
          # with sbp_. A project API key (service_role/anon) will 401 here — it
          # authenticates to <ref>.supabase.co, not to the account-level API.
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *) echo "::warning::The Management token does not start with 'sbp_'. If the call below returns 401, the secret likely holds a project API key rather than a personal access token." ;;
          esac

          # Precedence: explicit secret → derived from SUPABASE_URL → known default.
          # sed -n/p leaves $ref empty when SUPABASE_URL isn't a standard
          # supabase.co URL, rather than echoing the whole URL back.
          ref="${SUPABASE_PROJECT_REF:-}"
          if [ -z "$ref" ]; then
            ref=$(printf '%s' "${SUPABASE_URL:-}" | sed -nE 's#^https?://([^.]+)\.supabase\.(co|in)/?$#\1#p')
          fi
          if [ -z "$ref" ]; then
            ref="$DEFAULT_PROJECT_REF"
            echo "::warning::SUPABASE_URL is not a standard supabase.co URL — using the default project ref."
          fi
          echo "Project ref: $ref"

          api="https://api.supabase.com/v1/projects/$ref"
          auth="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"

          # -f would swallow the API's own error body, which is the only thing
          # that explains a 401. Capture code and body separately instead.
          resp=$(curl -sS -w $'\n%{http_code}' -H "$auth" "$api") || resp=$'\n000'
          http=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')

          if [ "$http" = "401" ] || [ "$http" = "403" ]; then
            echo "::error::Management API returned $http for project $ref."
            echo "::error::The token is not accepted at api.supabase.com. Create a personal access token"
            echo "::error::at https://supabase.com/dashboard/account/tokens (it will start with 'sbp_')"
            echo "::error::and store it as SUPABASE_ACCESS_TOKEN. Project API keys do not work here."
            echo "API response: $body"
            exit 1
          fi
          if [ "$http" != "200" ]; then
            echo "::error::Management API returned HTTP $http for project $ref."
            echo "API response: $body"
            exit 1
          fi

          status=$(printf '%s' "$body" | jq -r '.status // "UNKNOWN"')
          echo "Current status: $status"

          if [ "$status" = "ACTIVE_HEALTHY" ]; then
            echo "Project is already awake."
            exit 0
          fi

          if [ "$status" = "INACTIVE" ]; then
            echo "Project is paused — issuing restore."
            curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
              -d '{}' "$api/restore" >/dev/null
          else
            echo "Project is in a transitional state ($status) — waiting for it to settle."
          fi

          # Restores routinely take several minutes.
          for attempt in $(seq 1 40); do
            sleep 15
            status=$(curl -fsS -H "$auth" "$api" | jq -r '.status // "UNKNOWN"')
            echo "  [$attempt/40] status=$status"
            if [ "$status" = "ACTIVE_HEALTHY" ]; then
              echo "Project is awake after $((attempt * 15))s."
              exit 0
            fi
          done

          echo "::error::Supabase project did not reach ACTIVE_HEALTHY within 10 minutes (last status: $status)."
          exit 1

      # ─── 2. Did Railway already ship this week? ─────────────────────────────
      - name: Check this week's issue
        id: check_issue
        env:
          FORCE_GENERATE: ${{ inputs.force_generate }}
          SKIP_GENERATE: ${{ inputs.skip_generate }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::error::The SUPABASE_SERVICE_KEY secret is required and is empty."
            echo "::error::Copy the service_role key from Supabase → Project Settings → API"
            echo "::error::into Settings → Secrets and variables → Actions (not Dependabot/Codespaces)."
            exit 1
          fi

          row=$(curl -fsS \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/newsletter_issues?week_start=eq.$WEEK_START&select=issue_number,slug,status")

          count=$(printf '%s' "$row" | jq 'length')
          echo "newsletter_issues rows for week_start=$WEEK_START: $count"

          have_row=false
          have_html=false
          slug=""

          if [ "$count" -gt 0 ]; then
            have_row=true
            slug=$(printf '%s' "$row" | jq -r '.[0].slug')
            issue_number=$(printf '%s' "$row" | jq -r '.[0].issue_number')
            status=$(printf '%s' "$row" | jq -r '.[0].status')
            echo "Found Issue #$issue_number ($slug), status=$status"
            echo "slug=$slug" >> "$GITHUB_OUTPUT"
            echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

            if [ -f "client/public/newsletter/$slug.html" ]; then
              have_html=true
            else
              echo "::warning::Supabase row exists but client/public/newsletter/$slug.html is missing."
            fi
          fi

          # A missing row and a missing page are different failures and need
          # different repairs. No row means nothing was ever written: generate.
          # A row with no page means Railway generated the issue and then failed
          # the GitHub commit — the prose already exists and was already paid
          # for, so re-generating would both cost a second Claude call and
          # publish text that no longer matches content_json. Render what is
          # stored instead.
          needs_generate=false
          needs_republish=false
          if [ "$have_row" != "true" ]; then
            needs_generate=true
          elif [ "$have_html" != "true" ]; then
            needs_republish=true
            echo "Row exists without a page — republishing stored content, not regenerating."
          fi
          if [ "$FORCE_GENERATE" = "true" ]; then
            echo "force_generate=true — generating regardless."
            needs_generate=true
            needs_republish=false
          fi
          if [ "$SKIP_GENERATE" = "true" ]; then
            echo "skip_generate=true — suppressing generation and republish."
            needs_generate=false
            needs_republish=false
          fi

          echo "needs_generate=$needs_generate" >> "$GITHUB_OUTPUT"
          echo "needs_republish=$needs_republish" >> "$GITHUB_OUTPUT"
          echo "have_row=$have_row" >> "$GITHUB_OUTPUT"
          echo "have_html=$have_html" >> "$GITHUB_OUTPUT"

      # ─── 3. Fallback generation (same pipeline Railway runs) ────────────────
      - uses: actions/setup-python@v6
        if: steps.check_issue.outputs.needs_generate == 'true' || steps.check_issue.outputs.needs_republish == 'true'
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        if: steps.check_issue.outputs.needs_generate == 'true' || steps.check_issue.outputs.needs_republish == 'true'
        working-directory: client/newsletter-cron
        run: pip install -r requirements.txt

      - name: Republish stored content
        if: steps.check_issue.outputs.needs_republish == 'true'
        working-directory: client/newsletter-cron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          NEWSLETTER_BASE_URL: ${{ secrets.NEWSLETTER_BASE_URL }}
          TELEGRAM_GROUP: ${{ secrets.TELEGRAM_GROUP }}
          TELEGRAM_LINK_BASE: ${{ secrets.TELEGRAM_LINK_BASE }}
          # This repo is a monorepo — the HTML lives under client/, not public/.
          NEWSLETTER_OUTPUT_DIR: client/public/newsletter
          NEWSLETTER_TEMPLATE_FILE: junk-mail-TEMPLATE.html
        run: |
          set -euo pipefail
          # No ANTHROPIC_API_KEY here on purpose: this path must never call the
          # model, and leaving the key out makes that a property of the job
          # rather than a promise in a comment.
          python generate_newsletter.py --republish \
            --issue-number "${{ steps.check_issue.outputs.issue_number }}"

      - name: Scrape Telegram for the target week
        if: steps.check_issue.outputs.needs_generate == 'true'
        working-directory: client/newsletter-cron
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_GROUP: ${{ secrets.TELEGRAM_GROUP }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_SESSION_STRING:-}" ]; then
            echo "::warning::TELEGRAM_SESSION_STRING not set — skipping scrape."
            echo "::warning::Generation will use whatever telegram_messages rows already exist."
            exit 0
          fi
          python scrape_telegram.py backfill --start "$WEEK_START" --end "$WEEK_END"

      - name: Generate newsletter
        if: steps.check_issue.outputs.needs_generate == 'true'
        working-directory: client/newsletter-cron
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          NEWSLETTER_BASE_URL: ${{ secrets.NEWSLETTER_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OPENCLAW_WEBHOOK_URL: ${{ secrets.OPENCLAW_WEBHOOK_URL }}
          # This repo is a monorepo — the HTML lives under client/, not public/.
          NEWSLETTER_OUTPUT_DIR: client/public/newsletter
          NEWSLETTER_TEMPLATE_FILE: junk-mail-TEMPLATE.html
        run: |
          set -euo pipefail
          ARGS="--week-start $WEEK_START --week-end $WEEK_END"
          # Re-running a week Railway already numbered must not bump the counter.
          if [ "${{ steps.check_issue.outputs.have_row }}" = "true" ]; then
            ARGS="$ARGS --issue-number ${{ steps.check_issue.outputs.issue_number }} --no-increment"
          fi
          echo "python generate_newsletter.py $ARGS"
          python generate_newsletter.py $ARGS

      # ─── 4. Redeploy the site ───────────────────────────────────────────────
      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL not set — skipping redeploy."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$VERCEL_DEPLOY_HOOK_URL")
          echo "Vercel deploy hook responded $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Vercel deploy hook failed with HTTP $code"
            exit 1
          fi

      # ─── 5. Did this week actually ship? ────────────────────────────────────
      # The run is green whether it generated, confirmed, or did nothing at all.
      # On 2026-08-02 it did nothing and still reported success, so the missing
      # issue went unnoticed. This step re-reads the state and FAILS the run
      # unless the week actually shipped.
      #
      # "Shipped" means BOTH halves, checked separately. Issue #021 had a
      # Supabase row and no page — Railway generated it and then failed the
      # GitHub commit — and a row-only check would have called that week green
      # while nothing was readable. A reader cannot open a database row.
      - name: Verify the issue shipped
        if: always() && inputs.skip_generate != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          row=$(curl -fsS \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/newsletter_issues?week_start=eq.$WEEK_START&select=issue_number,slug,status" \
            ) || row="[]"
          count=$(printf '%s' "$row" | jq 'length' 2>/dev/null || echo 0)

          if [ "$count" -eq 0 ]; then
            echo "::error::No issue exists for $WEEK_START → $WEEK_END. The newsletter did not ship."
            {
              echo "> ## ❌ NO ISSUE FOR THIS WEEK"
              echo "> Nothing exists for \`$WEEK_START\` → \`$WEEK_END\`. Neither Railway nor"
              echo "> this safety net produced it. Check the log above for the cause —"
              echo "> a missing \`ANTHROPIC_API_KEY\`, an exhausted Anthropic credit"
              echo "> balance, or an empty \`telegram_messages\` week are the usual ones."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          slug=$(printf '%s' "$row" | jq -r '.[0].slug')
          status=$(printf '%s' "$row" | jq -r '.[0].status')
          echo "Supabase row: $slug (status=$status)"

          # Ask GitHub, not the local checkout: the page is committed through the
          # Contents API after this job checked out, so the working tree never
          # sees it.
          page="client/public/newsletter/$slug.html"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/$page?ref=${{ github.event.repository.default_branch }}")
          echo "GET $page → HTTP $code"

          if [ "$code" = "200" ]; then
            echo "OUTCOME: $slug shipped — row and page both present."
            echo "> ## ✅ Issue \`$slug\` shipped for \`$WEEK_START\` → \`$WEEK_END\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::$slug exists in Supabase but $page is not in the repo. The issue is unreadable."
          {
            echo "> ## ❌ ISSUE GENERATED BUT NEVER PUBLISHED"
            echo "> \`$slug\` exists in Supabase (status \`$status\`) but \`$page\`"
            echo "> is missing from the repo, so there is no page to read. The content"
            echo "> is safe — rerun this workflow to publish it from the stored"
            echo "> \`content_json\`, no regeneration needed. If this keeps happening,"
            echo "> Railway's \`GITHUB_TOKEN\` is the likely cause: it is a personal"
            echo "> access token separate from every other credential here, and an"
            echo "> expired one fails exactly this way and nothing else."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target week | \`$WEEK_START\` → \`$WEEK_END\` |"
            echo "| Supabase row found | \`${{ steps.check_issue.outputs.have_row }}\` |"
            echo "| Static HTML found | \`${{ steps.check_issue.outputs.have_html }}\` |"
            echo "| Ran fallback generation | \`${{ steps.check_issue.outputs.needs_generate }}\` |"
            echo "| Republished stored content | \`${{ steps.check_issue.outputs.needs_republish }}\` |"
            echo "| Issue | \`${{ steps.check_issue.outputs.slug }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
